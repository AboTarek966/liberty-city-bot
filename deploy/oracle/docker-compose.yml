# ============================================
# Liberty City Bot — Oracle Cloud Always Free
# ============================================
services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: liberty-city-bot
    restart: unless-stopped
    env_file:
      - ../../.env
    volumes:
      - bot-data:/app/data
    # البوت ليس خدمة ويب — لا منافذ مطلوبة
    # ports: []
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:

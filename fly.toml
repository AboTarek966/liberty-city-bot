# fly.toml app configuration file generated for liberty-city-bot on 2026-10-10T23:52:58+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'liberty-city-bot'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  TZ = 'UTC'

[processes]
  app = 'node dist/index.js'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
